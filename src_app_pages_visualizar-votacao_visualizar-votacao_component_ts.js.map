<div class="votacao-container" *ngIf="votacao">

    <section class="votacao-header">

        <img [src]="votacao.imagemUrl" [alt]="votacao.nome" class="banner" />

        <div class="header-content">

            <span class="badge">
                Votação de Escolha Única
            </span>

            <h1>{{ votacao.nome }}</h1>

            <p class="descricao">
                Selecione apenas um candidato para registrar seu voto.
            </p>

            <div class="periodo">

                <div>
                    <label>Início</label>
                    <span>
                        {{ votacao.dataInicio | date:'dd/MM/yyyy HH:mm' }}
                    </span>
                </div>

                <div>
                    <label>Encerramento</label>
                    <span>
                        {{ votacao.dataFim | date:'dd/MM/yyyy HH:mm' }}
                    </span>
                </div>

            </div>

        </div>

    </section>

    <div *ngIf="erro" class="alert error">{{ erro }}</div>

    <div *ngIf="votoRegistrado" class="alert success">Voto registrado com sucesso.</div>

    <section class="candidatos-grid">

        <div *ngFor="let candidato of votacao.candidatos" class="candidato-card"
            [class.selected]="candidatoSelecionado === candidato.votacaoCandidatoId"
            (click)="selecionar(candidato.votacaoCandidatoId)">

            <div class="radio-container">
                <input type="radio" name="candidato"
                    [checked]="candidatoSelecionado === candidato.votacaoCandidatoId" />
            </div>

            <img class="foto-candidato" [src]="candidato.imagemUrl" [alt]="candidato.nome" />

            <h3>{{ candidato.nome }}</h3>

        </div>

    </section>

    <div class="acoes">

        <button class="btn-confirmar" [disabled]="!candidatoSelecionado || enviando || votoRegistrado" (click)="confirmarVoto()">
            {{ enviando ? 'Enviando...' : (votoRegistrado ? 'Voto registrado' : 'Confirmar Voto') }}
        </button>

    </div>

</div>
