<div class="success-shell">

    <div class="success-card">

        <div class="success-icon">
            ✓
        </div>

        <div class="success-badge">
            PMI-DF • Prêmio Candango
        </div>

        <h1>
            Cadastro realizado com sucesso
        </h1>

        <p class="success-text">

            Sua inscrição foi enviada corretamente
            para a votação

            <strong *ngIf="votacao">
                {{ votacao }}
            </strong>.

        </p>

        <p class="success-subtext">

            As informações serão analisadas pela
            equipe organizadora do prêmio.

        </p>

        <a routerLink="/" class="primary-button">

            Voltar ao início

        </a>

    </div>

</div>
