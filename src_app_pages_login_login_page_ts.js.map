<div class="login-shell">

    <div class="login-card">

        <div class="logo-wrapper">

            <img src="assets/img/logo_pmi.png" alt="PMI-DF" class="logo" />

        </div>

        <div class="login-badge">
            PMI-DF • Administração
        </div>

        <h1>
            Acesso administrativo
        </h1>

        <p class="subtitle">
            Faça login para acessar o painel do sistema PMI-DF Premia.
        </p>

        <div *ngIf="error" class="alert error">

            {{ error }}

        </div>

        <form [formGroup]="form" (ngSubmit)="submit()">

            <div class="field">

                <label>E-mail</label>

                <input type="email" formControlName="email" placeholder="admin@pmidf.org.br" />

                <small class="field-error">
                    {{ fieldError('email') }}
                </small>

            </div>

            <div class="field">

                <label>Senha</label>

                <input type="password" formControlName="senha" placeholder="••••••••" />

                <small class="field-error">
                    {{ fieldError('senha') }}
                </small>

            </div>

            <button type="submit" [disabled]="loading">

                {{
                loading
                ? 'Entrando...'
                : 'Entrar'
                }}

            </button>

        </form>

    </div>

</div>
