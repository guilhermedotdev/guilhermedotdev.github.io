<div class="toolbar">
  <div>
    <div class="badge">Anos</div>
    <h2 style="margin:.5rem 0 0">Cadastro simples</h2>
  </div>
  <button class="secondary" (click)="load()" [disabled]="loading">Recarregar</button>
</div>

<div class="page-grid">
  <section class="panel card">
    <h3>Novo ano</h3>
    <div class="stack">
      <div>
        <label>Descrição</label>
        <input [formControl]="form.controls.descricao" placeholder="2026" />
      </div>
      <div class="form-actions">
        <button (click)="submit()" [disabled]="saving">Cadastrar</button>
      </div>
      @if (message) { <div class="alert success">{{ message }}</div> }
      @if (error) { <div class="alert error">{{ error }}</div> }
    </div>
  </section>

  <section class="panel card">
    <h3>Lista</h3>
    @if (loading) { <p class="muted">Carregando...</p> }
    @else {
      <table class="table">
        <thead><tr><th>ID</th><th>Descrição</th></tr></thead>
        <tbody>
          @for (item of items; track item.id) {
            <tr><td>{{ item.id }}</td><td>{{ item.descricao }}</td></tr>
          }
        </tbody>
      </table>
    }
  </section>
</div>
