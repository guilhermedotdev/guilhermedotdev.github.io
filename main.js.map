<div class="toolbar">
  <div>
    <div class="badge">Categorias</div>
    <h2 style="margin:.5rem 0 0">Cadastro e manutenção</h2>
  </div>
  <button class="secondary" (click)="load()" [disabled]="loading">Recarregar</button>
</div>

<div class="page-grid">
  <section class="panel card">
    <h3>{{ editingId ? 'Editar categoria' : 'Nova categoria' }}</h3>
    <div class="stack">
      <div>
        <label>Nome</label>
        <input [formControl]="form.controls.nome" placeholder="Ex.: Melhor Desenvolvedor" />
      </div>
      <div class="form-actions">
        <button (click)="submit()" [disabled]="saving">{{ editingId ? 'Salvar' : 'Cadastrar' }}</button>
        <button class="secondary" type="button" (click)="cancel()">Limpar</button>
      </div>
      @if (message) { <div class="alert success">{{ message }}</div> }
      @if (error) { <div class="alert error">{{ error }}</div> }
    </div>
  </section>

  <section class="panel card">
    <h3>Lista</h3>
    @if (loading) { <p class="muted">Carregando...</p> }
    @else {
      <table class="table">
        <thead><tr><th>ID</th><th>Nome</th><th>Ações</th></tr></thead>
        <tbody>
          @for (item of items; track item.id) {
            <tr>
              <td>{{ item.id }}</td>
              <td>{{ item.nome }}</td>
              <td>
                <div class="actions">
                  <button class="secondary" (click)="edit(item)">Editar</button>
                  <button class="danger" (click)="remove(item.id)">Excluir</button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    }
  </section>
</div>
